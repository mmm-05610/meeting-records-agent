<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 695" role="img" aria-label="两条有界 Agent 问答路径"><title>两条有界 Agent 问答路径</title><defs><marker id="arrow-agent" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#66758a"/></marker></defs><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#203047"><rect x="340" y="10" width="320" height="75" rx="12" fill="#eef4ff" stroke="#4775b6" stroke-width="1.6"/><text x="500.0" y="39" text-anchor="middle" font-weight="700" font-size="18">校验范围与理解问题</text><text x="500.0" y="65" text-anchor="middle" font-size="15">生成本轮会议快照，明确指代</text><polyline points="500,85 500,125" fill="none" stroke="#66758a" stroke-width="1.8" marker-end="url(#arrow-agent)"/><rect x="340" y="125" width="320" height="75" rx="12" fill="#eef4ff" stroke="#4775b6" stroke-width="1.6"/><text x="500.0" y="154" text-anchor="middle" font-weight="700" font-size="18">判断问题类型</text><text x="500.0" y="180" text-anchor="middle" font-size="15">事实 / 最后决定 / 变化原因</text><polyline points="340,162 165,162 165,240" fill="none" stroke="#66758a" stroke-width="1.8" marker-end="url(#arrow-agent)"/><text x="197" y="145" text-anchor="middle" font-size="14" fill="#40516b">普通事实</text><polyline points="660,162 835,162 835,240" fill="none" stroke="#66758a" stroke-width="1.8" marker-end="url(#arrow-agent)"/><text x="800" y="145" text-anchor="middle" font-size="14" fill="#40516b">决定与变更</text><rect x="20" y="240" width="290" height="100" rx="12" fill="#eef4ff" stroke="#4775b6" stroke-width="1.6"/><text x="165.0" y="269" text-anchor="middle" font-weight="700" font-size="18">检索相关片段</text><text x="165.0" y="295" text-anchor="middle" font-size="15">范围内向量检索 + 重排</text><text x="165.0" y="318" text-anchor="middle" font-size="15">必要时补读相邻块</text><rect x="690" y="240" width="290" height="100" rx="12" fill="#eef4ff" stroke="#4775b6" stroke-width="1.6"/><text x="835.0" y="269" text-anchor="middle" font-weight="700" font-size="18">逐场核对会议</text><text x="835.0" y="295" text-anchor="middle" font-size="15">先检索定位议题，再读完整分块</text><text x="835.0" y="318" text-anchor="middle" font-size="15">按会议日期整理确认和变更</text><polyline points="500,200 500,240" fill="none" stroke="#66758a" stroke-width="1.8" marker-end="url(#arrow-agent)" stroke-dasharray="6 5"/><text x="542" y="225" text-anchor="middle" font-size="14" fill="#40516b">有歧义</text><rect x="355" y="240" width="290" height="100" rx="12" fill="#fff7e7" stroke="#b28736" stroke-width="1.6"/><text x="500.0" y="269" text-anchor="middle" font-weight="700" font-size="18">澄清或收窄范围</text><text x="500.0" y="295" text-anchor="middle" font-size="15">对象不明或超出阅读预算</text><text x="500.0" y="318" text-anchor="middle" font-size="15">用户明确后恢复</text><polyline points="165,340 165,400 500,400 500,440" fill="none" stroke="#66758a" stroke-width="1.8" marker-end="url(#arrow-agent)"/><polyline points="835,340 835,400 500,400" fill="none" stroke="#66758a" stroke-width="1.8" marker-end="url(#arrow-agent)"/><rect x="340" y="440" width="320" height="95" rx="12" fill="#eef4ff" stroke="#4775b6" stroke-width="1.6"/><text x="500.0" y="469" text-anchor="middle" font-weight="700" font-size="18">归并结论与原文依据</text><text x="500.0" y="495" text-anchor="middle" font-size="15">提议 · 确认 · 变更 · 冲突 · 未知</text><text x="500.0" y="518" text-anchor="middle" font-size="15">不按最后提及或上传时间裁定</text><polyline points="500,535 500,575" fill="none" stroke="#66758a" stroke-width="1.8" marker-end="url(#arrow-agent)"/><rect x="270" y="575" width="460" height="95" rx="12" fill="#eaf7f1" stroke="#33836b" stroke-width="1.6"/><text x="500.0" y="604" text-anchor="middle" font-weight="700" font-size="18">校验引用，保存并显示回答</text><text x="500.0" y="630" text-anchor="middle" font-size="15">标识与原文匹配 · 再核对来源可用性</text><text x="500.0" y="653" text-anchor="middle" font-size="15">AnswerRecord 与范围进入同一 checkpoint</text></g></svg>