<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 385" role="img" aria-label="导入与状态核对流程"><title>导入与状态核对流程</title><defs><marker id="arrow-ingestion" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#66758a"/></marker></defs><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#203047"><rect x="30" y="20" width="265" height="100" rx="12" fill="#eef4ff" stroke="#4775b6" stroke-width="1.6"/><text x="162.5" y="49" text-anchor="middle" font-weight="700" font-size="18">校验导入信息</text><text x="162.5" y="75" text-anchor="middle" font-size="15">项目 · 名称 · 日期 · 类型</text><text x="162.5" y="98" text-anchor="middle" font-size="15">UTF-8 文件与内容摘要</text><polyline points="295,70 365,70" fill="none" stroke="#66758a" stroke-width="1.8" marker-end="url(#arrow-ingestion)"/><rect x="365" y="20" width="270" height="100" rx="12" fill="#eef4ff" stroke="#4775b6" stroke-width="1.6"/><text x="500.0" y="49" text-anchor="middle" font-weight="700" font-size="18">查询已有状态</text><text x="500.0" y="75" text-anchor="middle" font-size="15">稳定文档 ID</text><text x="500.0" y="98" text-anchor="middle" font-size="15">已存在 / 处理中 / 可创建</text><polyline points="635,70 705,70" fill="none" stroke="#66758a" stroke-width="1.8" marker-end="url(#arrow-ingestion)"/><rect x="705" y="20" width="265" height="100" rx="12" fill="#eef4ff" stroke="#4775b6" stroke-width="1.6"/><text x="837.5" y="49" text-anchor="middle" font-weight="700" font-size="18">R2R 直接入库</text><text x="837.5" y="75" text-anchor="middle" font-size="15">保存文件 · 解析 · 分块</text><text x="837.5" y="98" text-anchor="middle" font-size="15">embedding · 保存索引</text><polyline points="837,120 837,200" fill="none" stroke="#66758a" stroke-width="1.8" marker-end="url(#arrow-ingestion)"/><rect x="705" y="200" width="265" height="105" rx="12" fill="#eaf7f1" stroke="#33836b" stroke-width="1.6"/><text x="837.5" y="229" text-anchor="middle" font-weight="700" font-size="18">核对可查询条件</text><text x="837.5" y="255" text-anchor="middle" font-size="15">success + 分块存在</text><text x="837.5" y="278" text-anchor="middle" font-size="15">项目归属与元数据一致</text><polyline points="705,252 635,252" fill="none" stroke="#66758a" stroke-width="1.8" marker-end="url(#arrow-ingestion)"/><rect x="365" y="200" width="270" height="105" rx="12" fill="#eaf7f1" stroke="#33836b" stroke-width="1.6"/><text x="500.0" y="229" text-anchor="middle" font-weight="700" font-size="18">刷新会议列表</text><text x="500.0" y="255" text-anchor="middle" font-size="15">失效上游文档缓存</text><text x="500.0" y="278" text-anchor="middle" font-size="15">加入后续查询范围</text><polyline points="635,120 635,165 162,165 162,200" fill="none" stroke="#66758a" stroke-width="1.8" marker-end="url(#arrow-ingestion)" stroke-dasharray="6 5"/><text x="405" y="153" text-anchor="middle" font-size="14" fill="#40516b">请求超时或结果未知</text><rect x="30" y="200" width="265" height="105" rx="12" fill="#fff7e7" stroke="#b28736" stroke-width="1.6"/><text x="162.5" y="229" text-anchor="middle" font-weight="700" font-size="18">重新查询真实状态</text><text x="162.5" y="255" text-anchor="middle" font-size="15">不盲目重复上传</text><text x="162.5" y="278" text-anchor="middle" font-size="15">失败项显示具体原因</text><text x="500" y="355" text-anchor="middle" font-size="16">直接入库不等于持久任务队列；进程中断后的清理和重试需要验收</text></g></svg>